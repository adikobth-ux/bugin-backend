# Render Blueprint: сервер Bugin на бесплатном тарифе.
# Render → New → Blueprint → выбрать репозиторий bugin-backend.
# Бесплатный сервер засыпает после 15 минут без запросов и просыпается около минуты.
# Секреты (sync: false) в этом файле не хранятся — их вписывают в Render → Environment.
services:
  - type: web
    name: bugin-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Строка подключения Neon (postgresql://…). Без неё каталог живёт в памяти.
      - key: DATABASE_URL
        sync: false
      # Пароль админки /admin. Без него админка выключена.
      - key: ADMIN_PASSWORD
        sync: false
