[project]
name = "bugin-backend"
version = "0.1.0"
description = "Сервер приложения Bugin «Чем заняться сегодня?»"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI объявляет параметры запроса через вызовы в значениях по умолчанию.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
