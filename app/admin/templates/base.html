<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5B5BF0">
<title>{% block title %}Админка{% endblock %} · Bugin</title>
<style>
:root {
  --primary: #5B5BF0; --primary-ink: #fff; --bg: #F5F6FB; --card: #fff; --ink: #1B1B2F;
  --muted: #6B6F86; --line: #E3E5EF; --danger: #D93A4A; --ok: #1F8A5B; --warn-bg: #FFF4DB;
  --warn-ink: #7A5200; --chip: #EEF0FF; --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111218; --card: #1B1C25; --ink: #ECECF4; --muted: #9A9DB3; --line: #2C2E3B;
          --chip: #262850; --warn-bg: #3A2F12; --warn-ink: #F3D48A; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--primary); }
header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.bar { max-width: 760px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.brand { font-weight: 700; color: var(--ink); text-decoration: none; margin-right: auto; }
.brand span { color: var(--muted); font-weight: 500; }
@media (max-width: 480px) { .brand span { display: none; } }
nav { display: flex; gap: 2px; }
nav a { text-decoration: none; padding: 6px 10px; border-radius: 999px; color: var(--ink); }
nav a.on { background: var(--chip); color: var(--primary); font-weight: 600; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px; }
h1 { font-size: 24px; margin: 8px 0 16px; line-height: 1.2; }
h2 { font-size: 17px; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.notice { padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 15px; }
.notice.ok { background: #E4F6EC; color: #145C3C; }
.notice.warn { background: var(--warn-bg); color: var(--warn-ink); }
.notice.err { background: #FDE7EA; color: #8E1F2C; }
@media (prefers-color-scheme: dark) { .notice.ok { background: #16342A; color: #9FE0BF; } .notice.err { background: #3B1A20; color: #F5B3BD; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
       padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
       color: var(--ink); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.btn.link { border: 0; background: none; color: var(--muted); padding: 0 6px; font-weight: 500; }
input, select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
       border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--primary) 45%, transparent); border-color: var(--primary); }
input[type=checkbox], input[type=radio] { width: 20px; height: 20px; accent-color: var(--primary); margin: 0; }
label.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.field { margin-bottom: 18px; }
.field > label, .field > .label { display: block; font-weight: 600; margin-bottom: 6px; }
.req { color: var(--danger); }
.kk { display: flex; align-items: flex-start; gap: 8px; margin-top: 6px; }
.kk .lang { flex: none; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--chip);
            border-radius: 6px; padding: 3px 6px; margin-top: 10px; }
.kk input, .kk textarea { background: var(--card); }
.help { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.error { margin: 6px 0 0; font-size: 14px; color: var(--danger); font-weight: 600; }
.has-error input, .has-error select, .has-error textarea { border-color: var(--danger); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line);
               border-radius: 999px; background: var(--bg); cursor: pointer; }
.chips label:has(input:checked) { border-color: var(--primary); background: var(--chip); }
.amenity { margin-bottom: 12px; }
.amenity .name { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.amenity .row input:last-child { background: var(--card); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
.photo { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
.photo img, .photo .asset { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.photo .asset { display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
.photo .opts { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; font-size: 14px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li a { display: flex; gap: 12px; align-items: center; padding: 10px 0; color: var(--ink); text-decoration: none;
             border-bottom: 1px solid var(--line); }
.list li:last-child a { border-bottom: 0; }
.list .thumb { flex: none; width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--chip); }
.list .text { min-width: 0; flex: 1; }
.list .name { font-weight: 600; }
.list .name, .list .details { display: block; }
.list .details { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list li.past { opacity: .55; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 6px; margin-left: 6px;
         vertical-align: 2px; background: var(--chip); color: var(--primary); }
.badge.hidden { background: var(--line); color: var(--muted); }
.toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
.toolbar input { flex: 1; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
        color: var(--ink); text-decoration: none; }
.stat b { display: block; font-size: 28px; line-height: 1.1; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line);
           padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.savebar .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.upload { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.upload input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload .count { color: var(--muted); font-size: 14px; }
details summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="{{ base }}/">Bugin <span>админка</span></a>
    {% if logged_in %}
    <nav>
      <a href="{{ base }}/places" class="{{ 'on' if nav == 'places' }}">Места</a>
      <a href="{{ base }}/events" class="{{ 'on' if nav == 'events' }}">События</a>
    </nav>
    <form method="post" action="{{ base }}/logout"><button class="btn link" type="submit">Выйти</button></form>
    {% endif %}
  </div>
</header>
<main>
{% if logged_in and storage == 'memory' %}
  <div class="notice warn">База не подключена: правки хранятся в памяти и пропадут при перезапуске сервера.
  Добавьте <b>DATABASE_URL</b> в настройках Render.</div>
{% endif %}
{% block content %}{% endblock %}
</main>
<script>
document.addEventListener('change', function (e) {
  var input = e.target;
  if (input.type !== 'file') return;
  var count = input.closest('.upload') && input.closest('.upload').querySelector('.count');
  if (count) count.textContent = input.files.length ? 'Выбрано: ' + input.files.length : '';
});
</script>
</body>
</html>
