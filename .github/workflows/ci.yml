name: CI

# Проверка кода и тесты сервера на каждый push и pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    # Настоящий PostgreSQL для tests/test_postgres.py и запуска сервера с базой.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bugin
          POSTGRES_DB: bugin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:bugin@localhost:5432/bugin_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: .github/scripts/run.sh "ruff" ruff check .

      - name: Tests
        run: .github/scripts/run.sh "pytest" python -m pytest -q -rs

      # Сервер действительно стартует так же, как на Render: без базы и с базой.
      - name: Smoke start
        run: |
          check() {
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:$1/health > /tmp/health.json 2>/dev/null && break
              sleep 1
            done
            grep -q "\"storage\":\"$2\"" /tmp/health.json || {
              echo "::error title=smoke::/health на порту $1: $(cat /tmp/health.json 2>/dev/null)"; exit 1; }
            count=$(curl -fsS "http://127.0.0.1:$1/v1/places/nearby?limit=20" | python -c "import json,sys; print(len(json.load(sys.stdin)))")
            [ "$count" = "8" ] || { echo "::error title=smoke::мест $count вместо 8"; exit 1; }
            curl -fsS -o /dev/null "http://127.0.0.1:$1/admin/login" || {
              echo "::error title=smoke::админка не открылась"; exit 1; }
          }
          ADMIN_PASSWORD=smoke uvicorn app.main:app --port 8000 &
          check 8000 memory
          # Чистая база, как у нового Neon: сервер сам создаёт таблицы и заводит тестовые данные.
          python -c "import os, psycopg; psycopg.connect(os.environ['TEST_DATABASE_URL'], autocommit=True).execute('create database bugin_smoke')"
          DATABASE_URL="${TEST_DATABASE_URL%/*}/bugin_smoke" ADMIN_PASSWORD=smoke uvicorn app.main:app --port 8001 &
          check 8001 postgres
          echo "::notice title=smoke::сервер стартует без базы и с PostgreSQL, админка открывается"
